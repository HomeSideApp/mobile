name: homeside-mobile

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        WITH_ANDROID: ${WITH_ANDROID:-1}
        TZ: ${TZ:-UTC}
    image: homeside-mobile-dev:latest
    working_dir: /app
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
      - composer-cache:/home/dev/.composer
      - gradle-cache:/home/dev/.gradle
      # El SDK vive en un volumen: el primer build instala NDK/CMake/platform 36
      # y esos ~2 GB sobreviven entre corridas del contenedor.
      - android-sdk:/opt/android-sdk
    environment:
      HOME: /home/dev
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/default-java
      TZ: ${TZ:-UTC}
      # IP LAN del host que ve el teléfono; `make jump` la usa para el QR.
      JUMP_IP: ${JUMP_IP:-}
      GRADLE_HEAP: ${GRADLE_HEAP:-2048}
    extra_hosts:
      # Permite `adb connect host.docker.internal:5555` a un emulador del host.
      - "host.docker.internal:host-gateway"
    ports:
      # artisan serve
      - "8000:8000"
      # native:jump (http, websocket, bridge, vite proxy)
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"

  # Emulador Android headless (perfil opcional, requiere /dev/kvm).
  #   make emulator-up && make android-emulator
  emulator:
    profiles: ["emulator"]
    build:
      context: .
      dockerfile: docker/Dockerfile.emulator
      args:
        DEV_IMAGE: ${EMULATOR_BASE_IMAGE:-homeside-mobile-dev:latest}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        ANDROID_API: ${ANDROID_API:-35}
    image: homeside-mobile-emulator:latest
    devices:
      - /dev/kvm
    # El nodo /dev/kvm conserva el GID del host; se agrega como grupo
    # suplementario para que el usuario `dev` pueda abrirlo.
    group_add:
      - "${KVM_GID:-986}"
    environment:
      HOME: /home/dev
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/default-java
      TZ: ${TZ:-UTC}
      AVD_NAME: homeside
      EMULATOR_MEMORY: ${EMULATOR_MEMORY:-1536}
      EMULATOR_CORES: ${EMULATOR_CORES:-2}
    ports:
      # Consola del emulador (para snapshots/logs) y su puerto adb.
      - "5554:5554"
      - "5555:5555"
    healthcheck:
      test: ["CMD-SHELL", "adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 60s
    stop_grace_period: 30s

volumes:
  composer-cache:
  gradle-cache:
  android-sdk:
