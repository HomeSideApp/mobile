name: Android dev build

# Cada push a `develop` corre la suite y, si pasa, publica un APK instalable.
# El APK queda como artifact del run y además en el release rodante
# `dev-latest`, que tiene una URL estable para bajarlo desde el teléfono.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Construir y publicar el APK'
        type: boolean
        default: true

concurrency:
  group: android-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PHP_VERSION: '8.5'
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  changes:
    name: ¿Cambió código?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rutas que afectan el bundle nativo
        id: diff
        run: |
          set -euo pipefail

          # Lo que entra en el APK. Tests, docs, CI y herramientas de
          # desarrollo quedan afuera: cambian el repo, no el binario.
          pattern='^(app|bootstrap|config|database|lang|public|resources|routes)/|^(composer\.json|composer\.lock|artisan|nativephp\.lock|\.env\.example)$'

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Disparo manual: se construye." >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Evento ${GITHUB_EVENT_NAME}: el APK no se publica acá." >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"

          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            echo "Primer push de la rama: se construye." >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "${before}^{commit}" > /dev/null; then
            git fetch --quiet origin "$before" || true
          fi

          if ! changed=$(git diff --name-only "$before" "$GITHUB_SHA" 2> /dev/null); then
            echo "No pudimos comparar con el commit anterior: se construye igual." >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "Sin archivos cambiados." >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matched=$(echo "$changed" | grep -E "$pattern" || true)

          {
            echo "### Archivos cambiados"
            echo '```'
            echo "$changed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$matched" ]; then
            {
              echo "**Afectan el APK:**"
              echo '```'
              echo "$matched"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ninguno afecta el APK: no se construye. Usá *Run workflow* para forzarlo." >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, sqlite3, curl, xml, sockets
          coverage: none

      - name: Dependencias
        uses: ramsey/composer-install@4

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: PHPUnit
        run: php artisan test --compact

  apk:
    name: APK de desarrollo
    needs: [tests, changes]
    if: >-
      !cancelled() && needs.tests.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.build_apk != 'false') ||
        (github.event_name == 'push' && needs.changes.outputs.code == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, sqlite3, curl, xml, sockets
          coverage: none

      - name: JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK
        # v4 sacó el `sdkmanager tools` que Google dejó de publicar: con v3 el
        # step moría con "Failed to find package 'tools'".
        uses: android-actions/setup-android@v4

      - name: Paquetes del SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${ANDROID_NDK_VERSION}" > /dev/null

      - name: Cache de Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dependencias
        uses: ramsey/composer-install@4

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          echo "NATIVEPHP_ANDROID_SDK_LOCATION=${ANDROID_HOME}" >> .env
          echo "NATIVEPHP_GRADLE_TIMEOUT=900" >> .env

      - name: Proyecto nativo (PHP embebido + plugins)
        run: php artisan native:install android --no-interaction

      - name: Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p dist
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > dist/dev.p12
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            # Sin secreto: keystore efímera. El APK instala igual, pero cada run
            # firma distinto y Android pide desinstalar antes de actualizar.
            keytool -genkeypair \
              -keystore dist/dev.p12 -storetype PKCS12 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'homeside-dev' }}" \
              -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'homeside-dev' }}" \
              -alias homeside -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HomeSide Dev, OU=Mobile, O=HomeSide, C=AR" \
              -noprompt
            echo "source=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Build del APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'homeside-dev' }}
        run: |
          php artisan native:package android \
            --build-type=release \
            --keystore=dist/dev.p12 \
            --keystore-password="${KEYSTORE_PASSWORD}" \
            --key-alias=homeside \
            --key-password="${KEYSTORE_PASSWORD}" \
            --output=dist \
            --no-tty

      - name: Verificar la firma
        # NativePHP avisa "Build output is unsigned" cuando `jarsigner` no ve
        # una firma v1; los APK modernos se firman con v2/v3, invisibles para
        # jarsigner. `apksigner` es la verificación que vale.
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/app-release.apk

      - name: Nombre del artifact
        id: artifact
        run: |
          mv dist/app-release.apk "dist/homeside-${GITHUB_SHA::7}.apk"
          cp "dist/homeside-${GITHUB_SHA::7}.apk" dist/homeside-dev.apk
          echo "versioned=dist/homeside-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          sha256sum dist/homeside-dev.apk | cut -c1-64 > dist/homeside-dev.apk.sha256
          cat dist/homeside-dev.apk.sha256

      - name: Artifact del run
        uses: actions/upload-artifact@v7
        with:
          name: homeside-apk-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.versioned }}
            dist/homeside-dev.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Release rodante dev-latest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev-latest
          name: HomeSide dev (última de develop)
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Build automática de `develop`.

            - commit: `${{ github.sha }}`
            - autor: @${{ github.actor }}
            - keystore: `${{ steps.keystore.outputs.source }}`
            - instalación: `adb install -r homeside-dev.apk`

            Si el build anterior estaba firmado con otra keystore, Android va a
            rechazar la actualización: desinstalá la app y volvé a instalar.
          files: |
            dist/homeside-dev.apk
            dist/homeside-dev.apk.sha256

      - name: Resumen
        run: |
          {
            echo "### APK listo"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| keystore | \`${{ steps.keystore.outputs.source }}\` |"
            echo "| descarga | [homeside-dev.apk](https://github.com/${{ github.repository }}/releases/download/dev-latest/homeside-dev.apk) |"
            echo "| sha256 | \`$(cat dist/homeside-dev.apk.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
