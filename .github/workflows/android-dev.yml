name: Android

# Dos canales, un solo pipeline:
#
#   develop  → build de desarrollo, publicado en el release rodante `dev-latest`
#   v*       → release estable (tag semver), publicado como release normal
#
# Cada publicación lleva un `latest.json` que la app consulta para saber si hay
# actualización. El usuario elige en Perfil si sigue `dev` o `stable`.

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Construir y publicar el APK'
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PHP_VERSION: '8.5'
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  changes:
    name: ¿Cambió código?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rutas que afectan el bundle nativo
        id: diff
        run: |
          set -euo pipefail

          # Lo que entra en el APK. Tests, docs, CI y herramientas de
          # desarrollo quedan afuera: cambian el repo, no el binario.
          pattern='^(app|bootstrap|config|database|lang|public|resources|routes)/|^(composer\.json|composer\.lock|artisan|nativephp\.lock|\.env\.example)$'

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Disparo manual: se construye." >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Evento ${GITHUB_EVENT_NAME}: el APK no se publica acá." >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Tag ${GITHUB_REF_NAME}: release estable, se construye." >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"

          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            echo "Primer push de la rama: se construye." >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify --quiet "${before}^{commit}" > /dev/null; then
            git fetch --quiet origin "$before" || true
          fi

          if ! changed=$(git diff --name-only "$before" "$GITHUB_SHA" 2> /dev/null); then
            echo "No pudimos comparar con el commit anterior: se construye igual." >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$changed" ]; then
            echo "Sin archivos cambiados." >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matched=$(echo "$changed" | grep -E "$pattern" || true)

          {
            echo "### Archivos cambiados"
            echo '```'
            echo "$changed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$matched" ]; then
            {
              echo "**Afectan el APK:**"
              echo '```'
              echo "$matched"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ninguno afecta el APK: no se construye. Usá *Run workflow* para forzarlo." >> "$GITHUB_STEP_SUMMARY"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, sqlite3, curl, xml, sockets
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: PHPUnit
        run: php artisan test --compact

  build:
    # Nombre estático a propósito: en un job *skipped* GitHub no evalúa las
    # expresiones del `name:` y el run lista el texto crudo
    # (`APK (${{ ... }})`), que parece un error de configuración. El canal se
    # informa en el resumen y en el nombre del release.
    name: APK
    needs: [tests, changes]
    if: >-
      !cancelled() && needs.tests.result == 'success' &&
      (
        (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.ref_type == 'branch' && (
          (github.event_name == 'workflow_dispatch' && github.event.inputs.build_apk != 'false') ||
          (github.event_name == 'push' && needs.changes.outputs.code == 'true')
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, gd, zip, bcmath, pdo_sqlite, sqlite3, curl, xml, sockets
          coverage: none

      - name: JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Android SDK
        # v4 sacó el `sdkmanager tools` que Google dejó de publicar: con v3 el
        # step moría con "Failed to find package 'tools'".
        uses: android-actions/setup-android@v4

      - name: Paquetes del SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${ANDROID_NDK_VERSION}" > /dev/null

      - name: Cache de Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache de Composer
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Versión de la app
        id: version
        run: |
          set -euo pipefail

          if [ "${CHANNEL}" = "stable" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}-dev"
          fi

          # version_code tiene que subir siempre: lo usa Android para aceptar
          # la actualización encima de la instalada, y la app para comparar.
          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Entorno
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --no-interaction

          set_env() {
            local key="$1" value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          set_env NATIVEPHP_APP_VERSION "$VERSION"
          set_env NATIVEPHP_APP_VERSION_CODE "$VERSION_CODE"
          set_env NATIVEPHP_ANDROID_SDK_LOCATION "$ANDROID_HOME"
          set_env NATIVEPHP_GRADLE_TIMEOUT 900

          echo "Versión ${VERSION} (code ${VERSION_CODE}), canal ${CHANNEL}"

      - name: Proyecto nativo (PHP embebido + plugins)
        run: php artisan native:install android --no-interaction

      - name: Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p dist
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > dist/dev.p12
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            # Sin secreto: keystore efímera. El APK instala igual, pero cada run
            # firma distinto y Android pide desinstalar antes de actualizar.
            keytool -genkeypair \
              -keystore dist/dev.p12 -storetype PKCS12 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'homeside-dev' }}" \
              -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'homeside-dev' }}" \
              -alias homeside -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HomeSide Dev, OU=Mobile, O=HomeSide, C=AR" \
              -noprompt
            echo "source=ephemeral" >> "$GITHUB_OUTPUT"
          fi

      - name: Build del APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'homeside-dev' }}
        run: |
          php artisan native:package android \
            --build-type=release \
            --keystore=dist/dev.p12 \
            --keystore-password="${KEYSTORE_PASSWORD}" \
            --key-alias=homeside \
            --key-password="${KEYSTORE_PASSWORD}" \
            --output=dist \
            --no-tty

      - name: Verificar la firma
        # NativePHP avisa "Build output is unsigned" cuando `jarsigner` no ve
        # una firma v1; los APK modernos se firman con v2/v3, invisibles para
        # jarsigner. `apksigner` es la verificación que vale.
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/app-release.apk

      - name: Nombre del artifact y manifiesto
        id: artifact
        run: |
          set -euo pipefail

          # `native:package` incrementa NATIVEPHP_APP_VERSION_CODE en .env antes
          # de compilar (exige un build number mayor en cada subida a la tienda).
          # El manifiesto tiene que describir el APK que salió, no el número que
          # le pedimos: si publicamos el de entrada, la app queda siempre un
          # build adelante de lo publicado y nunca ve una actualización.
          VERSION="$(grep -E '^NATIVEPHP_APP_VERSION=' .env | cut -d= -f2-)"
          VERSION_CODE="$(grep -E '^NATIVEPHP_APP_VERSION_CODE=' .env | cut -d= -f2-)"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          APK="dist/homeside-${VERSION}.apk"
          mv dist/app-release.apk "$APK"

          # Guarda: leer el `.env` que quedó *dentro* del APK. Es el valor que la
          # app va a comparar, y el que se desincronizó cuando confiábamos en el
          # número de entrada.
          bundle_zip="$(mktemp -d)/bundle.zip"
          unzip -p "$APK" assets/laravel_bundle.zip > "$bundle_zip"
          apk_version_code="$(unzip -p "$bundle_zip" .env | grep -E '^NATIVEPHP_APP_VERSION_CODE=' | cut -d= -f2- | tr -d '\r')"

          if [ "${apk_version_code}" != "${VERSION_CODE}" ]; then
            echo "::error::El manifiesto diría ${VERSION_CODE} pero el APK lleva ${apk_version_code}. No se publica."
            exit 1
          fi

          echo "El APK lleva version_code=${apk_version_code}, igual que el manifiesto."

          if [ "${CHANNEL}" = "dev" ]; then
            # Nombre estable para humanos; el manifiesto apunta acá.
            cp "$APK" dist/homeside-dev.apk
            APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-latest/homeside-dev.apk"
            UPLOAD="dist/homeside-dev.apk"
          else
            APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/homeside-${VERSION}.apk"
            UPLOAD="$APK"
          fi

          SHA="$(sha256sum "$UPLOAD" | cut -d' ' -f1)"

          php scripts/write-update-manifest.php \
            --channel="${CHANNEL}" \
            --version="${VERSION}" \
            --version-code="${VERSION_CODE}" \
            --min-version-code="${MIN_VERSION_CODE:-0}" \
            --apk-url="${APK_URL}" \
            --sha256="${SHA}" \
            --notes="$(git log -1 --pretty=%s)" \
            --output=dist/latest.json

          echo "upload=${UPLOAD}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "url=${APK_URL}" >> "$GITHUB_OUTPUT"

      - name: Artifact del run
        uses: actions/upload-artifact@v7
        with:
          name: homeside-apk-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.upload }}
            dist/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          # dev → release rodante `dev-latest` (prerelease, no compite por "latest")
          # stable → release del tag, marcado como latest
          tag_name: ${{ env.CHANNEL == 'dev' && 'dev-latest' || github.ref_name }}
          name: ${{ env.CHANNEL == 'dev' && 'HomeSide dev (última de develop)' || format('HomeSide {0}', steps.artifact.outputs.version) }}
          prerelease: ${{ env.CHANNEL == 'dev' }}
          make_latest: ${{ env.CHANNEL == 'stable' }}
          fail_on_unmatched_files: true
          body: |
            Canal: `${{ env.CHANNEL }}`
            Versión: `${{ steps.artifact.outputs.version }}` (code `${{ steps.artifact.outputs.version_code }}`)
            Keystore: `${{ steps.keystore.outputs.source }}`
            Commit: `${{ github.sha }}` por @${{ github.actor }}
            sha256: `${{ steps.artifact.outputs.sha256 }}`

            Instalación: `adb install -r homeside-*.apk`, o abrir el APK en el
            teléfono. Si el build anterior estaba firmado con otra keystore,
            Android va a pedir desinstalar antes de actualizar.
          files: |
            ${{ steps.artifact.outputs.upload }}
            dist/latest.json

      - name: Resumen
        run: |
          {
            echo "### APK ${{ env.CHANNEL }} listo"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| versión | \`${{ steps.artifact.outputs.version }}\` (code \`${{ steps.artifact.outputs.version_code }}\`) |"
            echo "| canal | \`${{ env.CHANNEL }}\` |"
            echo "| keystore | \`${{ steps.keystore.outputs.source }}\` |"
            echo "| descarga | ${{ steps.artifact.outputs.url }} |"
            echo "| sha256 | \`${{ steps.artifact.outputs.sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
